name: 🧪 Manual Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android-release:
    name: 📱 Android Test APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup Java (+ Gradle cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Pub get
        run: flutter pub get

      - name: 🔐 Decode keystore + Firebase config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          mkdir -p android/app/src/release
          echo "${{ secrets.FIREBASE_JSON_RELEASE }}" | base64 --decode > android/app/src/release/google-services.json
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore missing or empty"; exit 1; }
          test -s android/app/src/release/google-services.json || { echo "::error::Firebase config missing or empty"; exit 1; }

      - name: 📱 Build signed APKs (test)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          API_LINK: ${{ secrets.API_LINK }}
          GRADLE_OPTS: -Xmx4G -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
        run: |
          flutter build apk --split-per-abi --target-platform android-arm64 --release \
            --build-number "${{ github.run_number }}" \
            --dart-define=API_LINK="$API_LINK" \
            --dart-define=ENVIRONMENT=prod

      - name: ✏️ Rename APKs
        run: |
          DIR=build/app/outputs/flutter-apk
          N=${{ github.run_number }}
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/Next-Bus-Test-${N}-arm64.apk"
          ls -la "$DIR"

      - name: 📦 Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: test-apks-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/Next-Bus-Test-*.apk
          if-no-files-found: error
          retention-days: 3
          archive: false
