name: Build, Release, and Deploy

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  verify:
    name: Analyze & Test
    uses: ./.github/workflows/flutter-analyze-test.yml

  android-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup Java (+ Gradle cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔐 Decode keystore + Firebase config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          mkdir -p android/app/src/release
          echo "${{ secrets.FIREBASE_JSON_RELEASE }}" | base64 --decode > android/app/src/release/google-services.json
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore missing or empty"; exit 1; }
          test -s android/app/src/release/google-services.json || { echo "::error::Firebase config missing or empty"; exit 1; }

      - name: 📱 Build signed APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          API_LINK: ${{ secrets.API_LINK }}
          GRADLE_OPTS: -Xmx4G -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
        run: |
          flutter build apk --split-per-abi --target-platform android-arm64 --release \
            --build-name "${TAG#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=API_LINK="$API_LINK" \
            --dart-define=ENVIRONMENT=prod

      - name: ✏️ Rename APK
        run: |
          DIR=build/app/outputs/flutter-apk
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/Next-Bus-${TAG}-(64-Bit).apk"

      - name: 🚀 Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/Next-Bus-*.apk
          fail_on_unmatched_files: true

  web-deploy:
    needs: verify
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🕸️ Build Web
        env:
          API_LINK: ${{ secrets.API_LINK }}
        run: |
          flutter build web --release --wasm \
            --dart-define=API_LINK="$API_LINK" \
            --dart-define=ENVIRONMENT=prod \
            --build-name "${TAG#v}"

      - name: 🔥 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_NEXTBUS }}
          channelId: live
          projectId: app-nextbus

  notify:
    needs: [verify, android-release, web-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ (needs.verify.result == 'success' && needs.android-release.result == 'success' && (needs.web-deploy.result == 'success' || needs.web-deploy.result == 'skipped')) && 'success' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure') }}
          nodetail: true
          title: "Next Bus ${{ github.event.release.tag_name }}"
          description: |
            **Repo:** ${{ github.repository }}
            **Workflow:** ${{ github.workflow }}
            **Triggered by:** ${{ github.actor }}

            **Analyze & Test:** ${{ needs.verify.result }}
            **Android Build:** ${{ needs.android-release.result }}
            **Web Deploy:** ${{ needs.web-deploy.result == 'skipped' && '⏩ Skipped (pre-release)' || needs.web-deploy.result }}

            [Download release](${{ github.event.release.html_url }})
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ (needs.android-release.result == 'success' && needs.verify.result == 'success') && '0x2ecc71' || '0xe74c3c' }}
          url: ${{ github.event.release.html_url }}