name: nextbus
description: "An App to store bus timing and to show when next bus will come"
publish_to: 'none' # Prevents accidental publishing to pub.dev
# after update dependencies analyze with : flutter analyze
version: 2.2.0-dev+3

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.50.0

dependencies:
  cached_network_image: ^4.0.7
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  dynamic_color: ^2.1.0
  firebase_analytics: ^13.1.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_performance: ^0.12.2
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.3
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  scroll_to_index: ^3.0.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  launcher_name: ^1.0.2

# Flutter-specific configurations
flutter:

  uses-material-design: true

  assets:
    - assets/logo.png

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

#  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  # Adaptive Icon Config (Android 8.0+)
  adaptive_icon_background: "#039AE4"
  adaptive_icon_foreground: "assets/logo_fg.png"
  # Android 13+ Monochromatic/Themed Home Screen Icon Config
  adaptive_icon_monochrome: "assets/logo_mono.png"
  web:
    generate: true

#  dart run launcher_name:main
launcher_name:
  default: "Next Bus"

# dart run change_app_package_name:main com.example.expend_note
# flutter pub add dev:change_app_package_name  